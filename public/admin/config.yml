backend:
  name: git-gateway
  branch: main

# Zet dit op 'true' tijdens lokaal testen met: npx decap-server
# (dan hoeft Caro niet in te loggen op je eigen computer)
local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

publish_mode: editorial_workflow

collections:
  - name: woningen
    label: Woningen
    label_singular: Woning
    folder: src/content/woningen
    create: true
    slug: "{{slug}}"
    summary: "{{titel}} — {{plaats}}"
    fields:
      - { label: Titel, name: titel, widget: string }
      - { label: Plaats, name: plaats, widget: string, hint: "Bijv. Moraira, Alicante" }
      - { label: Regio, name: regio, widget: string, default: "Costa Blanca" }
      - { label: Status, name: status, widget: select, options: ["Te koop", "Onder optie", "Verkocht"], default: "Te koop" }
      - { label: Prijs in euro, name: prijs, widget: number, value_type: int, min: 0 }
      - { label: Slaapkamers, name: slaapkamers, widget: number, value_type: int, min: 0 }
      - { label: Badkamers, name: badkamers, widget: number, value_type: int, min: 0 }
      - { label: Woonoppervlak (m²), name: woonoppervlak, widget: number, value_type: int, min: 0 }
      - { label: Perceel (m²), name: perceel, widget: number, value_type: int, min: 0 }
      - { label: Bouwjaar, name: bouwjaar, widget: number, value_type: int }
      - { label: Hero-foto, name: hero, widget: image, hint: "De grote foto bovenaan de pagina" }
      - { label: Video (optioneel), name: video, widget: string, required: false, hint: "Link naar een mp4-bestand; leeg laten als er geen video is" }
      - { label: Kenmerken binnen, name: kenmerkenBinnen, widget: list }
      - { label: Kenmerken buiten, name: kenmerkenBuiten, widget: list }
      - label: Galerij
        name: galerij
        widget: list
        summary: "{{fields.label}}"
        fields:
          - { label: Foto, name: src, widget: image }
          - { label: Bijschrift, name: label, widget: string, required: false }
      - label: Afstanden
        name: afstanden
        widget: list
        summary: "{{fields.plek}} — {{fields.tijd}}"
        fields:
          - { label: Plek, name: plek, widget: string }
          - { label: Tijd, name: tijd, widget: string, hint: "Bijv. 5 min" }
      - { label: Volgorde op de homepage, name: volgorde, widget: number, value_type: int, default: 10 }
      - { label: Beschikbaar tonen, name: beschikbaar, widget: boolean, default: true }
      - { label: In de spotlight zetten, name: uitgelicht, widget: boolean, default: false, hint: "Maximaal één woning; dit pand komt groot bovenaan de homepage" }
      - { label: Omschrijving, name: body, widget: markdown }
